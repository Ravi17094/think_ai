name: AWS Authentication Check

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check OIDC identity claims
        shell: python
        run: |
          import os, json, base64, urllib.request

          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          url += "&audience=sts.amazonaws.com"
          request = urllib.request.Request(
              url,
              headers={
                  "Authorization": "Bearer " +
                      os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]
              }
          )
          with urllib.request.urlopen(request, timeout=20) as response:
              token = json.load(response)["value"]

          payload = token.split(".")[1]
          claims = json.loads(base64.urlsafe_b64decode(
              payload + "=" * (-len(payload) % 4)
          ))

          for key in ("iss", "aud", "sub", "repository", "ref"):
              print(f"{key}: {claims.get(key)}")

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::661609780373:role/ThinkzAI-GitHub-ECR-Push
          aws-region: ap-south-2
          retry-max-attempts: 2

      - name: Verify AWS identity
        run: aws sts get-caller-identity
