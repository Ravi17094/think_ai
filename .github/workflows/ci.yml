name: Thinkz AI CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-quality:
    name: Backend Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Backend lint
        working-directory: backend
        run: npm run lint

      - name: Backend CI tests
        working-directory: backend
        run: npm run test:ci

  frontend-quality:
    name: Frontend Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend CI lint
        working-directory: frontend
        run: npm run lint:ci

      - name: Frontend tests
        working-directory: frontend
        run: npm test

      - name: Frontend production build
        working-directory: frontend
        run: npm run build

  docker-build:
    name: Backend Docker Build
    runs-on: ubuntu-latest
    needs:
      - backend-quality
      - frontend-quality

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build production backend image
        run: |
          docker build \
            -t thinkz-prod-api:ci \
            ./backend

      - name: Verify image size
        run: |
          SIZE_BYTES="$(docker image inspect thinkz-prod-api:ci --format '{{.Size}}')"
          SIZE_MB="$((SIZE_BYTES / 1000000))"

          echo "Backend image size: ${SIZE_MB} MB"

          if [ "$SIZE_BYTES" -ge 400000000 ]; then
            echo "ERROR: Backend image must remain below 400 MB"
            exit 1
          fi

          echo "PASS: Backend image is below 400 MB"

      - name: Verify non-root runtime user
        run: |
          USER="$(docker image inspect thinkz-prod-api:ci --format '{{.Config.User}}')"

          echo "Runtime user: $USER"

          if [ -z "$USER" ] || [ "$USER" = "0" ] || [ "$USER" = "root" ]; then
            echo "ERROR: Production container must not run as root"
            exit 1
          fi

          echo "PASS: Production container uses non-root user"
